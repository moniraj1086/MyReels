<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyReels - Premium Short Videos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #000000; color: #ffffff; font-family: Arial, sans-serif; overflow: hidden; }
        .reels-container { width: 100vw; height: 100vh; scroll-snap-type: y mandatory; overflow-y: scroll; scroll-behavior: smooth; }
        .reel-viewport { width: 100%; height: 100vh; scroll-snap-align: start; position: relative; display: flex; justify-content: center; align-items: center; background: #000000; }
        .video-player-mock { font-size: 70px; color: rgba(255,255,255,0.4); animation: pulse 1.5s infinite; }
        .overlay-controllers { position: absolute; right: 15px; bottom: 120px; display: flex; flex-direction: column; align-items: center; gap: 20px; z-index: 10; }
        .action-btn { background: rgba(255, 255, 255, 0.15); border: none; width: 55px; height: 55px; border-radius: 50%; color: white; font-size: 24px; cursor: pointer; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(10px); transition: transform 0.1s; }
        .action-btn:active { transform: scale(0.9); }
        .like-active { color: #ff2b55; }
        .video-meta-data { position: absolute; left: 15px; bottom: 30px; z-index: 10; max-width: 75%; }
        .username { font-weight: bold; font-size: 16px; margin-bottom: 8px; color: #ffffff; }
        .caption { font-size: 14px; color: #e1e1e1; line-height: 1.4; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="reels-container">
        <!-- Reel 1 -->
        <div class="reel-viewport">
            <div class="video-player-mock">▶</div>
            <div class="video-meta-data">
                <div class="username">@moniraj_boss</div>
                <div class="caption">MyReels App v1.0 is officially live on GitHub! 🚀 #MyReels #TikTokKiller #AMOLED</div>
            </div>
            <div class="overlay-controllers">
                <button class="action-btn like-active" onclick="alert('Liked!')">❤️</button>
                <button class="action-btn" onclick="alert('Comments opening...')">💬</button>
                <button class="action-btn" onclick="alert('Sharing link...')">🔗</button>
            </div>
        </div>
    </div>
</body>
</html>
